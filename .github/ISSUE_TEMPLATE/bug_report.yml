name: 问题反馈
description: 使用合成、脱敏信息报告可复现的问题。
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        安全漏洞请按 SECURITY.md 私密报告，不要在此披露利用细节。请勿上传真实录音、逐字稿、纪要、时叙录材料、数据库、.env、密钥或 Cookie。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我已使用合成或脱敏材料，附件、截图和日志不含个人资料或凭据。
          required: true
        - label: 这不是需要私密报告的安全漏洞。
          required: true
  - type: input
    id: version
    attributes:
      label: 版本与运行方式
      description: 填写提交号或发布版本，以及本地或自行部署；无需提供真实域名、账号和主机地址。
      placeholder: "提交号；Windows；本地隔离测试"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与受影响模块
      description: 系统、浏览器及版本、Python/Node.js 版本；说明汇言笔或时叙录，以及 API / Worker 是否按要求运行。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      description: 用虚构人物、合成文字或测试音频说明操作步骤。
      placeholder: |
        1. 在隔离测试数据目录中……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 预期与实际结果
      description: 可附脱敏错误信息和合成截图；不要粘贴整份生产日志。
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: 已尝试的检查
      description: 列出已执行的测试或排查；未测试也请直接注明。
